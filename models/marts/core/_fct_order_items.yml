models:
  - name: fct_order_items
    description: One row per order line, with pricing, discount and cost. All line-level money is published here.
    config:
      contract:
        enforced: true            # SQL must return exactly these columns and types, or the build fails
      meta:
        grain: one row per order line
        primary_key: order_item_id
        business_owner: VP Commerce
        sla: refreshed daily, ready by 06:30 ET
        tier: 1
        consumers: [semantic_layer, power_bi]
    data_tests:
      - dbt_utils.unique_combination_of_columns:       # grain: one line number per order
          arguments:
            combination_of_columns: [order_id, line_number]
      - dbt_utils.expression_is_true:                   # net = gross - discount, to the cent
          arguments:
            expression: "abs(line_gross_amount - line_discount_amount - line_net_amount) <= 0.01"
          config: {store_failures: true}
      - dbt_utils.expression_is_true:                   # selling below cost is suspicious, not fatal
          arguments:
            expression: "line_net_amount >= line_cost_amount"
          config: {severity: warn, store_failures: true}

    columns:
      - name: order_item_id
        description: Primary key.
        data_type: bigint
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
      - name: order_id
        description: Parent order. Joins to fct_orders.
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [not_null]
      - name: line_number
        description: Line position within the order.
        data_type: integer
      - name: product_id
        description: Product sold. -1 = product not in the catalog yet (Unknown product member).
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests:
          - not_null
          - relationships:                              # error severity: the -1 row makes this pass
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: customer_id
        description: Customer who placed the order.
        data_type: bigint
      - name: order_date
        description: Calendar date of the parent order.
        data_type: date
        constraints: [{type: not_null}]
      - name: order_status
        description: Status of the parent order.
        data_type: varchar
      - name: sales_channel
        description: web or mobile_app.
        data_type: varchar
      - name: quantity
        description: Units on the line.
        data_type: integer
        data_tests:
          - dbt_utils.accepted_range:                   # [8] zero/negative lines removed in staging
              arguments: {min_value: 1, max_value: 100}
      - name: unit_price
        description: Price at order time; falls back to catalog list price when the source price is missing.
        data_type: decimal(12, 2)
        data_tests:
          - not_null                                    # [7] proves the price fallback worked
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: unit_cost
        description: Product unit cost (0 for unknown products).
        data_type: decimal(12, 2)
      - name: discount_pct
        description: Promo discount rate applied to the order (0 to 0.2).
        data_type: decimal(5, 4)
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 0.2}
      - name: line_gross_amount
        description: quantity x unit_price.
        data_type: decimal(14, 2)
      - name: line_discount_amount
        description: line_gross_amount x discount_pct.
        data_type: decimal(14, 2)
      - name: line_net_amount
        description: line_gross_amount - line_discount_amount.
        data_type: decimal(14, 2)
      - name: line_cost_amount
        description: quantity x unit_cost.
        data_type: decimal(14, 2)
