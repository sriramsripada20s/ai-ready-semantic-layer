models:
  - name: fct_order_items
    description: One row per order line, with pricing, discount and cost. All line-level money is published here.

    # --- contract + ownership ---
    config:
      contract:
        enforced: true                  # build fails if SQL columns/types differ from this file
      meta:
        grain: one row per order line
        primary_key: order_item_id
        business_owner: VP Commerce
        sla: refreshed daily, ready by 06:30 ET
        tier: 1
        consumers: [semantic_layer, power_bi]

    # --- table-level tests ---
    data_tests:
      - dbt_utils.unique_combination_of_columns:       # grain: one line number per order
          arguments:
            combination_of_columns: [order_id, line_number]
      - dbt_utils.expression_is_true:                   # net = gross - discount, to the cent
          arguments:
            expression: "abs(line_gross_amount - line_discount_amount - line_net_amount) <= 0.01"
          config: {store_failures: true}
      - dbt_utils.expression_is_true:                   # selling below cost is suspicious, not fatal
          arguments:
            expression: "line_net_amount >= line_cost_amount"
          config: {severity: warn, store_failures: true}

    # --- semantic model ---
    semantic_model:
      enabled: true
      name: order_items                 # MetricFlow's name for this table
    agg_time_dimension: order_date      # same date as orders, so product and order metrics line up

    # --- columns ---
    columns:
      # entities (join keys)
      - name: order_item_id
        description: Primary key.
        data_type: bigint
        constraints: [{type: not_null}, {type: primary_key}]
        data_tests: [unique, not_null]
        entity: {type: primary, name: order_item}
      - name: order_id
        description: Parent order. Joins to fct_orders.
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests: [not_null]
        entity: {type: foreign, name: sales_order}      # same name as in fct_orders, so they join
      - name: product_id
        description: Product sold. -1 = product not in the catalog yet (Unknown product member).
        data_type: bigint
        constraints: [{type: not_null}]
        data_tests:
          - not_null
          - relationships:                              # error severity: the -1 row makes this pass
              arguments:
                to: ref('dim_products')
                field: product_id
        entity: {type: foreign, name: product}          # joins to dim_products for category/brand
      - name: customer_id
        description: Customer who placed the order.
        data_type: bigint
        entity: {type: foreign, name: customer}         # product revenue by region/segment

      # dimensions (group by / filter)
      - name: order_date
        description: Calendar date of the parent order.
        data_type: date
        constraints: [{type: not_null}]
        granularity: day
        dimension: {type: time, label: Order date}
      - name: order_status
        description: Status of the parent order.
        data_type: varchar
        dimension: {type: categorical, label: Line order status}  # used by this model's metric filters

      # detail and amounts (used by metrics, not grouped by)
      - name: line_number
        description: Line position within the order.
        data_type: integer
      - name: sales_channel
        description: web or mobile_app.
        data_type: varchar
      - name: quantity
        description: Units on the line.
        data_type: integer
        data_tests:
          - dbt_utils.accepted_range:                   # [8] zero/negative lines removed in staging
              arguments: {min_value: 1, max_value: 100}
      - name: unit_price
        description: Price at order time; falls back to catalog list price when the source price is missing.
        data_type: decimal(12, 2)
        data_tests:
          - not_null                                    # [7] proves the price fallback worked
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, inclusive: false}
      - name: unit_cost
        description: Product unit cost (0 for unknown products).
        data_type: decimal(12, 2)
      - name: discount_pct
        description: Promo discount rate applied to the order (0 to 0.2).
        data_type: decimal(5, 4)
        data_tests:
          - dbt_utils.accepted_range:
              arguments: {min_value: 0, max_value: 0.2}
      - name: line_gross_amount
        description: quantity x unit_price.
        data_type: decimal(14, 2)
      - name: line_discount_amount
        description: line_gross_amount x discount_pct.
        data_type: decimal(14, 2)
      - name: line_net_amount
        description: line_gross_amount - line_discount_amount.
        data_type: decimal(14, 2)
      - name: line_cost_amount
        description: quantity x unit_cost.
        data_type: decimal(14, 2)

    # --- metrics: same "recognized" rule as orders, applied at line level ---
    metrics:
      - name: units_sold
        label: Units sold
        description: Units on recognized orders (completed or shipped).
        type: simple
        agg: sum
        expr: quantity
        filter: "{{ Dimension('order_item__order_status') }} in ('completed', 'shipped')"

      - name: product_net_revenue
        label: Product net revenue
        description: >
          Line-level net revenue on recognized orders. Ties exactly to net_revenue
          (tests/assert_line_revenue_ties_to_orders.sql) but can be sliced by product.
        type: simple
        agg: sum
        expr: line_net_amount
        filter: "{{ Dimension('order_item__order_status') }} in ('completed', 'shipped')"
        config:
          meta: {business_owner: VP Commerce, tier: 1, certified: true}

      - name: product_cost
        label: Product cost
        description: Cost of goods on recognized orders.
        type: simple
        agg: sum
        expr: line_cost_amount
        filter: "{{ Dimension('order_item__order_status') }} in ('completed', 'shipped')"
