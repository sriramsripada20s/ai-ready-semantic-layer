# =========================================================================
# PRODUCTION DEPLOYMENT (CD) WORKFLOW
# Builds the final, clean tables that Power BI and the business actually use.
# It also saves the "state" of production so CI can do fast SLIM builds later.
# =========================================================================
name: Prod

on:
  # 1. Runs automatically whenever a Pull Request is merged into the 'main' branch.
  push:
    branches: [main]

  # 2. Runs automatically every day at 10:17 UTC (~6 AM Eastern) to ensure fresh data.
  schedule:
    - cron: "17 10 * * 1"

  # 3. Allows you to click a "Run workflow" button in GitHub to trigger it manually.
  workflow_dispatch:

concurrency:
  group: prod
  # NEVER cancel a production build halfway through. If two merges happen fast,
  # the second one will wait in a queue rather than breaking a build mid-step.
  cancel-in-progress: false

permissions:
  contents: read                  # We only need to read the code, not write back to it.

env:
  # Use the 'prod' target in profiles.yml. This tells dbt to build the tables
  # in their official, clean locations (like STAGING, MARTS) instead of a dev schema.
  DBT_PROFILES_DIR: .
  DBT_TARGET: prod

  # Snowflake login credentials (pulled safely from GitHub Secrets)
  SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_PRIVATE_KEY_PATH: /tmp/rsa_key.p8

jobs:
  deploy:
    name: Deploy to prod
    # We do this all in one single job so the final step can access
    # the target/ folder generated by the dbt build step.
    runs-on: ubuntu-latest
    steps:

      # ================================================================
      # SETUP: Prepare the virtual machine
      # ================================================================
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }

      - name: Install pinned packages
        run: pip install -r requirements.txt

      - name: Snowflake key
        env: { KEY: "${{ secrets.SNOWFLAKE_PRIVATE_KEY }}" }
        run: |
          # Write the private key into a secure, hidden temp file
          printf '%s\n' "$KEY" > /tmp/rsa_key.p8
          chmod 600 /tmp/rsa_key.p8

      - name: Install dbt packages
        run: dbt deps

      # ================================================================
      # STEP 1: Check if the raw data is fresh
      # ================================================================
      - name: Source freshness (reports, doesn't block)
        run: dbt source freshness
        # We allow this to fail without breaking the whole build because demo data ages.
        # In a real company, you would remove this so stale data stops the pipeline.
        continue-on-error: true

      # ================================================================
      # STEP 2: Build and Test the Production Tables
      # ================================================================
      - name: Build + test prod models
        # This creates the physical tables in Snowflake and runs tests (like checking for nulls).
        run: dbt build --exclude tag:profiling

      # ================================================================
      # STEP 3: Validate the Semantic Layer
      # ================================================================
      - name: Validate semantic layer
        # Checks if MetricFlow YAML still perfectly matches the newly built production tables
        run: mf validate-configs

      - name: Smoke test a certified metric
        # Runs a real query to guarantee the semantic engine is working end-to-end
        run: mf query --metrics net_revenue,recognized_orders --group-by metric_time__year --order metric_time__year --decimals 2

      # ================================================================
      # STEP 4: Save the "State" for future CI runs
      # ================================================================
      # This is critical. It uploads the manifest.json file from this successful run.
      # Tomorrow, when a developer opens a PR, Job 3 in the CI pipeline will download
      # this file to figure out exactly what changed, allowing for a fast "SLIM" build.
      - name: Save prod manifest
        uses: actions/upload-artifact@v4
        with:
          name: prod-manifest
          path: target/manifest.json
          retention-days: 30

      # ================================================================
      # STEP 5: Create a Summary Table for the GitHub UI
      # ================================================================
      - name: Write run summary
        # always() means this runs even if the build failed, so you can see what broke
        if: always()
        run: |
          echo "### Prod deploy (${{ github.event_name }})" >> "$GITHUB_STEP_SUMMARY"
          if [ -f target/run_results.json ]; then
            python -c "import json,collections; r=json.load(open('target/run_results.json'))['results']; c=collections.Counter(x['status'] for x in r); print('| status | count |\n|---|---|'); [print(f'| {k} | {v} |') for k,v in sorted(c.items())]" >> "$GITHUB_STEP_SUMMARY"
          fi
